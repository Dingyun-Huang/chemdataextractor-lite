[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemdataextractor-lite"
version = "1.0.0"
description = "Lightweight scientific document loaders for HTML, XML, PDF, and plain text."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "cssselect>=1.0.1",
  "lxml>=4.9",
  "nltk>=3.8",
  "pdfminer.six>=20220524",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chemdataextractor*"]

[tool.setuptools.package-data]
chemdataextractor = ["data/*.pickle", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
